<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aangan Call Desk</title>
<style>
  :root {
    color-scheme: light;
    --bg: #faf6f0; --card: #fffdf9; --ink: #2a2118; --muted: #7a6e60; --line: #eadfd0; --soft: #f4ece1;
    --accent: #b5532f; --good: #3f7a4f; --warn: #a8741a; --bad: #a8402c; --alert: #6b4aa0;
    --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 56px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font: 600 20px var(--serif); }
  h1 { font: 600 24px/1.1 var(--serif); margin: 0; letter-spacing: -.01em; }
  .tag { color: var(--muted); font-size: 13px; margin-top: 2px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  select, button, input { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; }
  button { cursor: pointer; } button:hover { border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
  .kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 22px; }
  .kpi .v { font: 600 32px/1.1 var(--serif); font-variant-numeric: tabular-nums; }
  .kpi .s { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .kpi.hot .v { color: var(--accent); }
  .section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .section-head h2 { margin: 0; font: 600 20px var(--serif); text-transform: none; letter-spacing: 0; color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 4px 12px; font-size: 13px; } .chip[aria-pressed=true] { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .feed { display: grid; gap: 10px; margin-bottom: 26px; }
  .lead { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start; padding: 14px 16px; }
  .lead:hover { border-color: var(--accent); }
  .who { font-weight: 600; } .who a { color: var(--ink); text-decoration: none; } .who a:hover { color: var(--accent); }
  .sum { color: var(--muted); font-size: 13.5px; margin: 2px 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .next { margin-top: 8px; padding: 6px 10px; background: var(--soft); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; font-size: 13.5px; }
  .meta { text-align: right; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .meta a { display: block; color: var(--accent); margin-top: 4px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .03em; white-space: nowrap; }
  .QUALIFIED { background: #e3f1e6; color: var(--good); } .NEEDS_REVIEW { background: #f8ecd2; color: var(--warn); }
  .DECLINED { background: #f6e1db; color: var(--bad); } .ESCALATE { background: #ebe2f6; color: var(--alert); }
  .two { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); margin-bottom: 12px; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 90px; }
  .bars div { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .8; }
  ul.reasons { list-style: none; margin: 0; padding: 0; }
  ul.reasons li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
  ul.reasons li:last-child { border: 0; }
  .empty { color: var(--muted); font-size: 14px; }
  .warn { border-color: var(--warn); color: var(--warn); background: #fdf7e9; margin-bottom: 12px; }
  details.more { margin-bottom: 22px; } details.more summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .small { color: var(--muted); font-size: 12.5px; }
  #login { max-width: 340px; margin: 15vh auto; display: grid; gap: 12px; }
  #login h1 { font-size: 22px; }
  [hidden] { display: none !important; }
  a { color: var(--accent); }
  table.fields { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.fields th, table.fields td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.fields th { width: 190px; color: var(--muted); font-weight: 600; font-size: 13px; }
  .chat p { margin: 6px 0; } .chat .who { font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-right: 6px; }
  .chat .CALLER .who { color: var(--accent); }
  .task { border-left: 3px solid var(--accent); padding: 6px 12px; margin: 10px 0; background: var(--soft); border-radius: 0 8px 8px 0; }
  @media (max-width: 640px) { .lead { grid-template-columns: 1fr; } .meta { text-align: left; } .kpi .v { font-size: 28px; } }
</style>
</head>
<body>
<form id="login" class="card" hidden>
  <div class="brand"><div class="mark">A</div><h1>Aangan Call Desk</h1></div>
  <label for="pass" class="small">Dashboard passcode</label>
  <input id="pass" type="password" autocomplete="current-password" required>
  <button>Open</button>
  <div id="loginErr" class="small" style="color:var(--bad)"></div>
</form>

<main id="app" hidden>
  <header>
    <div class="brand"><div class="mark">A</div><div><h1>Aangan Call Desk</h1><div class="tag">AI front desk · every call answered, every lead handed off</div></div></div>
    <div id="controls">
      <label for="days" class="small">Period</label>
      <select id="days"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option></select>
      <button id="refresh">Refresh</button>
    </div>
  </header>
  <div id="detail" hidden></div>
  <div id="dash">
  <div id="rateWarn" class="card warn" hidden>Cost rates aren't set (VAANI_INR_PER_MIN), so the cost figures show ₹0.</div>
  <div id="crmFail" class="card warn" hidden><span id="crmFailText"></span> <button id="retry">Retry failed syncs</button> <span id="retryMsg" class="small"></span></div>
  <div id="unmatched" class="card warn" hidden></div>
  <div class="kpis" id="kpis"></div>
  <div class="section-head"><h2>Leads and next actions</h2><div class="chips" id="chips"></div></div>
  <div class="feed" id="feed"></div>
  <details class="more"><summary>More numbers</summary><div class="kpis" id="kpis2"></div></details>
  <div class="two">
    <section class="card"><h2>Calls per day</h2><div class="bars" id="bars"></div><div class="small" id="barsLabel"></div></section>
    <section class="card"><h2>Agent checks</h2><ul class="reasons" id="flags"></ul></section>
  </div>
  <div class="two">
    <section class="card"><h2>Why declined</h2><ul class="reasons" id="declined"></ul></section>
    <section class="card"><h2>Why sent for review</h2><ul class="reasons" id="review"></ul></section>
  </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const store = { get: k => { try { return sessionStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} } };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const human = c => c.replace(/^UNANSWERED_/, 'not answered: ').replace(/_/g, ' ').toLowerCase();
const lakh = v => '₹' + (v / 1e5).toLocaleString('en-IN', { maximumFractionDigits: 1 }) + 'L';
const inr = v => '₹' + Number(v).toLocaleString('en-IN');
const dur = s => s == null ? '—' : s < 60 ? `${s}s` : `${Math.round(s / 60)} min`;
const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '—';

function list(el, obj) {
  const items = Object.entries(obj).sort((a, b) => b[1] - a[1]);
  el.innerHTML = items.length ? items.map(([k, n]) => `<li><span>${esc(human(k))}</span><b>${n}</b></li>`).join('') : '<li class="empty">None</li>';
}

const leadId = new URLSearchParams(location.search).get('lead');
const when = iso => iso ? new Date(iso).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', dateStyle: 'medium', timeStyle: 'short' }) : '—';

function renderLead(d) {
  $('login').hidden = true; $('app').hidden = false; $('dash').hidden = true; $('controls').hidden = true; $('detail').hidden = false;
  const l = d.lead ?? {};
  const row = (k, v) => (v == null || v === '' || (Array.isArray(v) && !v.length) ? '' : `<tr><th>${k}</th><td>${esc(Array.isArray(v) ? v.join(', ') : v)}</td></tr>`);
  const links = [d.hubspot_url && ['Open in HubSpot', d.hubspot_url], d.calendly_booking_url && ['Calendly booking link', d.calendly_booking_url], d.recording_url && ['Recording', d.recording_url]]
    .filter(Boolean).map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`).join(' · ');
  $('detail').innerHTML = `
    <p><a href="/">← All calls</a></p>
    <section class="card">
      <h2>${esc(l.name ?? 'Name not given')} · ${esc(d.phone ?? 'no caller ID')} <span class="pill ${d.status}">${esc(d.status.replace('_', ' '))}</span></h2>
      <div class="small">${esc(when(d.call_started_at))} IST · ${Math.round((d.duration_sec ?? 0) / 6) / 10} min · cost ${inr(d.cost_inr ?? 0)}</div>
      ${d.next_task ? `<div class="task"><b>Next task:</b> ${esc(d.next_task)}</div>` : ''}
      ${l.call_summary ? `<p>${esc(l.call_summary)}</p>` : ''}
      ${(d.reasons?.length || d.notes?.length) ? `<p class="small">Why: ${esc([...(d.reasons ?? []), ...(d.notes ?? [])].map(human).join('; '))}</p>` : ''}
      ${d.flags?.length ? `<p style="color:var(--bad)">⚠ Agent check: ${esc(d.flags.map(human).join(', '))}</p>` : ''}
      ${d.hubspot_error ? `<p style="color:var(--bad)">CRM sync problem: ${esc(d.hubspot_error)}</p>` : ''}
      <p>${links}</p>
    </section>
    <div class="two" style="margin-top:12px">
      <section class="card"><h2>What the AI captured</h2><table class="fields">
        ${row('Segment', l.segment)}${row('Property', (l.property_type ?? '').replace('_', ' '))}${row('Project', (l.scope ?? '').replace('_', ' '))}
        ${row('Service', (l.project_kind ?? '').replace(/_/g, ' '))}${row('Area', [l.locality, l.city].filter(Boolean).join(', '))}
        ${row('Carpet area', l.carpet_sqft && l.carpet_sqft + ' sq ft')}${row('Rooms', l.rooms_in_scope)}${row('Complete by', l.deadline_date)}
        ${row('Site available', l.site_available_date)}${row('Decision-maker', l.decision_maker)}${row('Preferred time', l.preferred_slot)}
        ${row('Budget (volunteered)', l.budget_max && `${inr(l.budget_min ?? l.budget_max)} – ${inr(l.budget_max)}`)}${row('Referral', l.referral)}
        ${row('Email', l.email)}${row('Notes', l.caller_notes)}
        ${row('Consultation', d.consultation_status && human(d.consultation_status))}${row('Consultation time', d.consultation_start && when(d.consultation_start))}
      </table></section>
      <section class="card"><h2>Timeline</h2><ul class="reasons">
        ${(d.events ?? []).map(e => `<li><span>${esc(when(e.created_at))} · ${esc(e.source)} · ${esc(String(e.type).replace(/_/g, ' '))}</span></li>`).join('') || '<li class="empty">No events</li>'}
      </ul></section>
    </div>
    <section class="card chat" style="margin-top:12px"><h2>Transcript</h2>
      ${(d.transcript ?? []).map(t => `<p class="${esc(t.role)}"><span class="who">${t.role === 'AGENT' ? 'Agent' : 'Caller'}</span>${esc(t.text)}</p>`).join('') || '<p class="empty">The caller said nothing before the call dropped.</p>'}
    </section>`;
}

async function load() {
  let pass = store.get('pass');
  if (!pass) return showLogin();
  if (leadId) {
    const r = await fetch(`/api/lead?id=${encodeURIComponent(leadId)}`, { headers: { 'x-passcode': pass } });
    if (r.status === 401) { store.set('pass', ''); return showLogin('Wrong passcode.'); }
    if (!r.ok) { $('app').hidden = false; $('login').hidden = true; $('dash').hidden = true; $('controls').hidden = true; $('detail').hidden = false;
      $('detail').innerHTML = `<p><a href="/">← All calls</a></p><div class="card">Lead not found (${r.status}).</div>`; return; }
    return renderLead(await r.json());
  }
  const res = await fetch(`/api/stats?days=${$('days').value}`, { headers: { 'x-passcode': pass } });
  if (res.status === 401) { store.set('pass', ''); return showLogin('Wrong passcode.'); }
  if (!res.ok) { $('kpis').innerHTML = `<div class="card">Could not load data (${res.status}).</div>`; return; }
  render(await res.json());
}

let FILTER = 'ALL', LAST = null;
const STATUS_LABEL = { ALL: 'All', QUALIFIED: 'Qualified', NEEDS_REVIEW: 'Needs review', DECLINED: 'Declined', ESCALATE: 'Escalated' };
const fmt = iso => new Date(iso).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', dateStyle: 'medium', timeStyle: 'short' });

function renderFeed() {
  const rows = (LAST?.recent ?? []).filter(r => FILTER === 'ALL' || r.status === FILTER);
  $('chips').innerHTML = Object.entries(STATUS_LABEL).map(([k, t]) => `<button class="chip" data-f="${k}" aria-pressed="${k === FILTER}">${t}</button>`).join('');
  $('feed').innerHTML = rows.length ? rows.map(r => `<article class="card lead">
    <span class="pill ${r.status}">${esc(STATUS_LABEL[r.status] ?? r.status)}</span>
    <div>
      <div class="who"><a href="?lead=${encodeURIComponent(r.id)}">${esc(r.name ?? 'Caller')}</a><span class="small"> · ${esc(r.locality ?? 'area not given')} · ${esc(r.phone ?? 'no caller ID')}</span></div>
      ${r.summary ? `<p class="sum">${esc(r.summary)}</p>` : ''}
      ${r.next ? `<div class="next"><b>Next:</b> ${esc(r.next)}</div>` : ''}
      ${r.flags?.length ? `<div class="small" style="color:var(--bad);margin-top:6px">⚠ ${esc(r.flags.map(human).join(', '))}</div>` : ''}
      ${(r.reasons?.length || r.notes?.length) ? `<div class="small" style="margin-top:6px">${esc([...(r.reasons ?? []), ...(r.notes ?? [])].map(human).join(' · '))}</div>` : ''}
    </div>
    <div class="meta">${esc(fmt(r.at))}<br>${r.mins} min · ${inr(r.cost)}
      ${r.consultation ? `<br>${esc(human(r.consultation))}` : ''}
      ${r.crm === 'synced' && r.crmUrl ? `<a href="${esc(r.crmUrl)}" target="_blank" rel="noopener">HubSpot ↗</a>` : r.crm === 'failed' ? `<span style="color:var(--bad)" title="${esc(r.crmError)}">CRM failed</span>` : ''}
      <a href="?lead=${encodeURIComponent(r.id)}">Open lead</a>
    </div></article>`).join('') : '<div class="card empty">No calls in this view yet.</div>';
}
$('chips').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { FILTER = b.dataset.f; renderFeed(); } });

function render(d) {
  LAST = d;
  $('login').hidden = true; $('app').hidden = false;
  $('rateWarn').hidden = d.cost.ratesSet;
  $('crmFail').hidden = !d.crm.failed;
  $('unmatched').hidden = !d.consultations.unmatched;
  $('unmatched').textContent = `${d.consultations.unmatched} Calendly booking(s) couldn't be matched to a call — check Calendly and HubSpot.`;
  $('crmFailText').textContent = `${d.crm.failed} call(s) failed to sync to HubSpot.`;
  const s = d.byStatus;
  const booking = !d.consultations.connected ? ['Consultations booked', '—', 'set CALENDLY_EVENT_URL_RESIDENTIAL']
    : d.consultations.tracking === 'manual' ? ['Booking links sent', d.consultations.awaiting, 'booking status is tracked by hand in HubSpot']
    : ['Consultations booked', d.consultations.booked, `${pct(d.consultations.booked, s.QUALIFIED ?? 0)} of qualified · ${d.consultations.awaiting} awaiting`];
  const main = [
    ['Calls answered', d.calls, `${pct(d.afterHours, d.calls)} outside 10am–7pm or weekends`],
    ['Sent to designers', s.QUALIFIED ?? 0, `${pct(s.QUALIFIED ?? 0, d.calls)} of calls`, 'hot'],
    ['Needs review', s.NEEDS_REVIEW ?? 0, 'a human decides'],
    booking,
    ['Handoff time', dur(d.medianHandoffSec), 'median, call end → Telegram'],
    ['Cost to run', inr(d.cost.total), `${inr(d.cost.perCall)} per call · ${d.minutes} min`],
  ];
  const more = [
    ['Declined', s.DECLINED ?? 0, 'closed politely on the call'],
    ['Escalations', s.ESCALATE ?? 0, 'existing clients → Nikhil'],
    ['Pipeline', `${lakh(d.pipelineInr[0])}–${lakh(d.pipelineInr[1])}`, 'qualified × ₹8–14L average'],
    ['CRM', d.crm.connected ? `${d.crm.synced} synced` : 'not connected', d.crm.connected ? `${d.crm.failed} failed · HubSpot` : 'set HUBSPOT_SERVICE_KEY to sync'],
    ['Cost per qualified lead', d.cost.perQualified == null ? '—' : inr(d.cost.perQualified), 'cost to run ÷ qualified'],
  ];
  const tile = ([k, v, sub, cls = '']) => `<div class="card kpi ${cls}"><h2>${k}</h2><div class="v">${esc(v)}</div><div class="s">${esc(sub)}</div></div>`;
  $('kpis').innerHTML = main.map(tile).join(''); $('kpis2').innerHTML = more.map(tile).join('');
  renderFeed();

  const days = [];
  for (let i = d.days - 1; i >= 0; i--) days.push(new Date(Date.now() + 5.5 * 36e5 - i * 864e5).toISOString().slice(0, 10));
  const max = Math.max(1, ...days.map(x => d.byDay[x] ?? 0));
  $('bars').innerHTML = days.map(x => `<div title="${x}: ${d.byDay[x] ?? 0} calls" style="height:${100 * (d.byDay[x] ?? 0) / max}%"></div>`).join('');
  $('barsLabel').textContent = `${days[0]} → ${days.at(-1)} · busiest day ${max} calls`;

  list($('flags'), d.flags); list($('declined'), d.declineReasons); list($('review'), d.reviewReasons);
  if (!Object.keys(d.flags).length) $('flags').innerHTML = '<li class="empty">No prices quoted and no slots promised by the agent.</li>';
}

function showLogin(msg = '') { $('app').hidden = true; $('login').hidden = false; $('loginErr').textContent = msg; $('pass').focus(); }
$('login').addEventListener('submit', e => { e.preventDefault(); store.set('pass', $('pass').value); load(); });
$('refresh').addEventListener('click', load);
$('retry').addEventListener('click', async () => {
  $('retry').disabled = true; $('retryMsg').textContent = 'Retrying…';
  const res = await fetch('/api/retry-sync', { method: 'POST', headers: { 'x-passcode': store.get('pass') ?? '' } });
  const r = res.ok ? await res.json() : null;
  $('retryMsg').textContent = r ? `Fixed ${r.fixed} of ${r.retried}.` : `Retry failed (${res.status}).`;
  $('retry').disabled = false; load();
});
$('days').addEventListener('change', load);
load();
</script>
</body>
</html>
