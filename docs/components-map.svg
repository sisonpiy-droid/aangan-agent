<svg xmlns="http://www.w3.org/2000/svg" width="1688" height="1210" viewBox="0 0 1688 1210" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7685"/></marker></defs>
<style>.hd{fill:#fff;font:700 17px 'Segoe UI',Arial,sans-serif}.ac{fill:#fff;font:700 15px 'Segoe UI',Arial,sans-serif}.bx{fill:#1f2a37;font:700 13px 'Segoe UI',Arial,sans-serif}.ft{fill:#2a2118;font:700 15px 'Segoe UI',Arial,sans-serif}</style>
<rect width="1688" height="1210" fill="#f7f7f6"/>
<text x="56" y="52" font-size="34" font-weight="700" fill="#1b3553">Aangan Call Desk · Components Map</text>
<text x="56" y="82" font-size="16" fill="#6b7685">Inbound call: capture → understand → decide → hand off → track</text>
<rect x="56" y="120" width="1576" height="44" fill="#1b3553"/><text x="148" y="148" text-anchor="middle" class="hd">Actor</text><text x="356" y="148" text-anchor="middle" class="hd">Trigger</text><text x="588" y="148" text-anchor="middle" class="hd">Conversation</text><text x="820" y="148" text-anchor="middle" class="hd">Capture</text><text x="1052" y="148" text-anchor="middle" class="hd">AI</text><text x="1284" y="148" text-anchor="middle" class="hd">Decision</text><text x="1516" y="148" text-anchor="middle" class="hd">Output</text><rect x="56" y="164" width="1576" height="78" fill="#fbfbfa" stroke="#d6d9de" stroke-width="2"/><rect x="56" y="164" width="184" height="78" fill="#1b3553" stroke="#fff" stroke-width="1"/><text x="148" y="200" text-anchor="middle" class="ac">Prospect</text><text x="148" y="218" text-anchor="middle" class="ac">(Caller)</text><rect x="56" y="242" width="1576" height="78" fill="#f3f4f6" stroke="#d6d9de" stroke-width="2"/><rect x="56" y="242" width="184" height="78" fill="#1b3553" stroke="#fff" stroke-width="1"/><text x="148" y="278" text-anchor="middle" class="ac">Vaani Voice</text><text x="148" y="296" text-anchor="middle" class="ac">(AI agent)</text><rect x="56" y="320" width="1576" height="78" fill="#fbfbfa" stroke="#d6d9de" stroke-width="2"/><rect x="56" y="320" width="184" height="78" fill="#1b3553" stroke="#fff" stroke-width="1"/><text x="148" y="356" text-anchor="middle" class="ac">Backend</text><text x="148" y="374" text-anchor="middle" class="ac">(Vercel API)</text><rect x="56" y="398" width="1576" height="78" fill="#f3f4f6" stroke="#d6d9de" stroke-width="2"/><rect x="56" y="398" width="184" height="78" fill="#1b3553" stroke="#fff" stroke-width="1"/><text x="148" y="434" text-anchor="middle" class="ac">Supabase</text><text x="148" y="452" text-anchor="middle" class="ac">(Database)</text><rect x="56" y="476" width="1576" height="78" fill="#fbfbfa" stroke="#d6d9de" stroke-width="2"/><rect x="56" y="476" width="184" height="78" fill="#1b3553" stroke="#fff" stroke-width="1"/><text x="148" y="512" text-anchor="middle" class="ac">Gemini</text><text x="148" y="530" text-anchor="middle" class="ac">(AI)</text><rect x="56" y="554" width="1576" height="78" fill="#f3f4f6" stroke="#d6d9de" stroke-width="2"/><rect x="56" y="554" width="184" height="78" fill="#1b3553" stroke="#fff" stroke-width="1"/><text x="148" y="590" text-anchor="middle" class="ac">Rules</text><text x="148" y="608" text-anchor="middle" class="ac">(Code, no AI)</text><rect x="56" y="632" width="1576" height="78" fill="#fbfbfa" stroke="#d6d9de" stroke-width="2"/><rect x="56" y="632" width="184" height="78" fill="#1b3553" stroke="#fff" stroke-width="1"/><text x="148" y="668" text-anchor="middle" class="ac">Calendly</text><text x="148" y="686" text-anchor="middle" class="ac">(Booking)</text><rect x="56" y="710" width="1576" height="78" fill="#f3f4f6" stroke="#d6d9de" stroke-width="2"/><rect x="56" y="710" width="184" height="78" fill="#1b3553" stroke="#fff" stroke-width="1"/><text x="148" y="746" text-anchor="middle" class="ac">HubSpot</text><text x="148" y="764" text-anchor="middle" class="ac">(CRM)</text><rect x="56" y="788" width="1576" height="78" fill="#fbfbfa" stroke="#d6d9de" stroke-width="2"/><rect x="56" y="788" width="184" height="78" fill="#1b3553" stroke="#fff" stroke-width="1"/><text x="148" y="824" text-anchor="middle" class="ac">Telegram</text><text x="148" y="842" text-anchor="middle" class="ac">(Handoff)</text><rect x="56" y="866" width="1576" height="78" fill="#f3f4f6" stroke="#d6d9de" stroke-width="2"/><rect x="56" y="866" width="184" height="78" fill="#1b3553" stroke="#fff" stroke-width="1"/><text x="148" y="902" text-anchor="middle" class="ac">Email + SMS</text><text x="148" y="920" text-anchor="middle" class="ac">(To the caller)</text><rect x="56" y="944" width="1576" height="78" fill="#fbfbfa" stroke="#d6d9de" stroke-width="2"/><rect x="56" y="944" width="184" height="78" fill="#1b3553" stroke="#fff" stroke-width="1"/><text x="148" y="980" text-anchor="middle" class="ac">Dashboard</text><text x="148" y="998" text-anchor="middle" class="ac">(Web)</text><rect x="56" y="1022" width="1576" height="78" fill="#f3f4f6" stroke="#d6d9de" stroke-width="2"/><rect x="56" y="1022" width="184" height="78" fill="#1b3553" stroke="#fff" stroke-width="1"/><text x="148" y="1058" text-anchor="middle" class="ac">Team</text><text x="148" y="1076" text-anchor="middle" class="ac">(Human)</text><line x1="240" y1="164" x2="240" y2="1100" stroke="#d6d9de" stroke-width="2"/><line x1="472" y1="164" x2="472" y2="1100" stroke="#d6d9de" stroke-width="2"/><line x1="704" y1="164" x2="704" y2="1100" stroke="#d6d9de" stroke-width="2"/><line x1="936" y1="164" x2="936" y2="1100" stroke="#d6d9de" stroke-width="2"/><line x1="1168" y1="164" x2="1168" y2="1100" stroke="#d6d9de" stroke-width="2"/><line x1="1400" y1="164" x2="1400" y2="1100" stroke="#d6d9de" stroke-width="2"/><path d="M454,203 H588 V250" fill="none" stroke="#6b7685" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M686,281 H820 V328" fill="none" stroke="#6b7685" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M820,390 V406" fill="none" stroke="#6b7685" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M918,359 H1052 V484" fill="none" stroke="#6b7685" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1150,515 H1284 V562" fill="none" stroke="#6b7685" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1284,624 V640" fill="none" stroke="#6b7685" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1382,593 H1396" fill="none" stroke="#6b7685" stroke-width="2" stroke-dasharray="7 5"/><path d="M1382,671 H1396" fill="none" stroke="#6b7685" stroke-width="2" stroke-dasharray="7 5"/><path d="M1396,593 V1061" fill="none" stroke="#6b7685" stroke-width="2" stroke-dasharray="7 5"/><path d="M1396,749 H1418" fill="none" stroke="#6b7685" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1396,827 H1418" fill="none" stroke="#6b7685" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1396,905 H1418" fill="none" stroke="#6b7685" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1396,983 H1418" fill="none" stroke="#6b7685" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M1396,1061 H1418" fill="none" stroke="#6b7685" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><rect x="258" y="172" width="196" height="62" rx="9" fill="#dce9f8" stroke="#6b7685" stroke-width="1.5"/><text x="356" y="207.5" text-anchor="middle" class="bx">Phones the studio, any hour</text><rect x="490" y="250" width="196" height="62" rx="9" fill="#dce9f8" stroke="#6b7685" stroke-width="1.5"/><text x="588" y="277.5" text-anchor="middle" class="bx">Answers 24/7 and asks area,</text><text x="588" y="293.5" text-anchor="middle" class="bx">size, deadline, time, email</text><rect x="722" y="328" width="196" height="62" rx="9" fill="#f7e1a6" stroke="#6b7685" stroke-width="1.5"/><text x="820" y="355.5" text-anchor="middle" class="bx">Gets the call-finished</text><text x="820" y="371.5" text-anchor="middle" class="bx">webhook; merges redials</text><rect x="722" y="406" width="196" height="62" rx="9" fill="#d7ecd9" stroke="#6b7685" stroke-width="1.5"/><text x="820" y="433.5" text-anchor="middle" class="bx">Saves every call, lead and</text><text x="820" y="449.5" text-anchor="middle" class="bx">event</text><rect x="954" y="484" width="196" height="62" rx="9" fill="#f2d1dc" stroke="#6b7685" stroke-width="1.5"/><text x="1052" y="511.5" text-anchor="middle" class="bx">Reads the transcript, fills</text><text x="1052" y="527.5" text-anchor="middle" class="bx">the lead fields</text><rect x="1186" y="562" width="196" height="62" rx="9" fill="#f7e1a6" stroke="#6b7685" stroke-width="1.5"/><text x="1284" y="589.5" text-anchor="middle" class="bx">Decides: qualified, review,</text><text x="1284" y="605.5" text-anchor="middle" class="bx">declined, escalate</text><rect x="1186" y="640" width="196" height="62" rx="9" fill="#f7e1a6" stroke="#6b7685" stroke-width="1.5"/><text x="1284" y="667.5" text-anchor="middle" class="bx">Books the closest free slot</text><text x="1284" y="683.5" text-anchor="middle" class="bx">with a Google Meet link</text><rect x="1418" y="718" width="196" height="62" rx="9" fill="#f2c895" stroke="#6b7685" stroke-width="1.5"/><text x="1516" y="745.5" text-anchor="middle" class="bx">Contact, deal, note, call</text><text x="1516" y="761.5" text-anchor="middle" class="bx">and task</text><rect x="1418" y="796" width="196" height="62" rx="9" fill="#f2c895" stroke="#6b7685" stroke-width="1.5"/><text x="1516" y="823.5" text-anchor="middle" class="bx">Brief and transcript to the</text><text x="1516" y="839.5" text-anchor="middle" class="bx">designers</text><rect x="1418" y="874" width="196" height="62" rx="9" fill="#f2c895" stroke="#6b7685" stroke-width="1.5"/><text x="1516" y="901.5" text-anchor="middle" class="bx">Confirmation with the Meet</text><text x="1516" y="917.5" text-anchor="middle" class="bx">link to the caller</text><rect x="1418" y="952" width="196" height="62" rx="9" fill="#f2c895" stroke="#6b7685" stroke-width="1.5"/><text x="1516" y="979.5" text-anchor="middle" class="bx">Founder, team board and</text><text x="1516" y="995.5" text-anchor="middle" class="bx">revenue, read from Supabase</text><rect x="1418" y="1030" width="196" height="62" rx="9" fill="#f2c895" stroke="#6b7685" stroke-width="1.5"/><text x="1516" y="1057.5" text-anchor="middle" class="bx">Takes the next task and</text><text x="1516" y="1073.5" text-anchor="middle" class="bx">runs the consultation</text><rect x="56" y="1124" width="1576" height="46" rx="9" fill="#f1e2b9" stroke="#c9a94f"/><text x="844" y="1153" text-anchor="middle" class="ft">Gemini only reads the call. Rules in code decide every lead. The team makes the human calls.</text>
</svg>